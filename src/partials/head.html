  <!-- Boot flags set before first paint (no flash): js, preloader once per session, iris page transition -->
  <script>
    (function (d) {
      var h = d.documentElement, s;
      h.classList.add('js');
      try { s = window.sessionStorage; } catch (e) { s = null; }
      var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (s && !s.getItem('km-booted') && !reduce) h.classList.add('is-booting');
      else if (s && s.getItem('km-nav') && !reduce) h.classList.add('iris-arrive');
      if (s) s.removeItem('km-nav');
    })(document);
  </script>
