  <!-- ================= Sentinel camera (global, decorative) ================= -->
  <div class="sentinel" aria-hidden="true" data-sentinel>
    <svg class="sentinel-svg" viewBox="0 0 120 150">
      <defs>
        <linearGradient id="kmCamBody" x1="0" x2="1" y1="0" y2="0">
          <stop offset="0" stop-color="#FFFFFF"/>
          <stop offset=".55" stop-color="#F2F1ED"/>
          <stop offset="1" stop-color="#D9D6CE"/>
        </linearGradient>
        <linearGradient id="kmCamShield" x1="0" x2="1" y1="0" y2="0">
          <stop offset="0" stop-color="#FFFFFF"/>
          <stop offset=".7" stop-color="#EEECE7"/>
          <stop offset="1" stop-color="#D3D0C8"/>
        </linearGradient>
        <radialGradient id="kmCamLens" cx=".38" cy=".3" r=".9">
          <stop offset="0" stop-color="#4A62C9"/>
          <stop offset=".45" stop-color="#1A2035"/>
          <stop offset="1" stop-color="#0B0D10"/>
        </radialGradient>
      </defs>
      <!-- ceiling plate + arm (static) -->
      <rect x="34" y="-2" width="52" height="10" rx="4" fill="url(#kmCamBody)" stroke="#D2CFC6"/>
      <rect x="55.5" y="7" width="9" height="18" rx="2" fill="url(#kmCamBody)" stroke="#D2CFC6"/>
      <!-- rotating head: pivot at 60,30 -->
      <g class="sentinel-head">
        <circle cx="60" cy="30" r="9.5" fill="url(#kmCamBody)" stroke="#CFCBC2"/>
        <circle cx="60" cy="30" r="3" fill="#E2DFD8"/>
        <rect x="46" y="36" width="28" height="70" rx="11" fill="url(#kmCamBody)" stroke="#CFCBC2"/>
        <path d="M40 42c0-4 3-6 6-6h28c3 0 6 2 6 6v58c0 8-3 14-8 16H48c-5-2-8-8-8-16z" fill="url(#kmCamShield)" stroke="#CDC9C0"/>
        <rect x="40" y="56" width="40" height="2.5" fill="#1F4FFF"/>
        <path d="M44 66h32M44 70h32" stroke="#E0DDD5" stroke-width="1"/>
        <rect x="46.5" y="108" width="27" height="11" rx="4" fill="#20252D"/>
        <ellipse cx="60" cy="117.5" rx="10.5" ry="4.2" fill="url(#kmCamLens)"/>
        <circle class="sentinel-glint" cx="56" cy="116.6" r="1.7" fill="#FFB547"/>
        <circle class="sentinel-rec" cx="71" cy="47" r="2.1" fill="#F04438"/>
        <text x="60" y="88" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="6" fill="#8A8F98" letter-spacing=".5">K-01</text>
      </g>
    </svg>
    <span class="sentinel-chip"><i class="rec-dot"></i>CAM-01 · LIVE</span>
  </div>

  <!-- Volumetric beam + spotlight (drawn by JS each frame) -->
  <svg class="beam-layer" aria-hidden="true" data-beam>
    <defs>
      <linearGradient id="kmBeamGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#FFB547" stop-opacity=".55"/>
        <stop offset=".55" stop-color="#FFB547" stop-opacity=".16"/>
        <stop offset="1" stop-color="#FFB547" stop-opacity=".05"/>
      </linearGradient>
      <radialGradient id="kmSpotGrad">
        <stop offset="0" stop-color="#FFC56B" stop-opacity=".38"/>
        <stop offset=".55" stop-color="#FFB547" stop-opacity=".12"/>
        <stop offset="1" stop-color="#FFB547" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <polygon class="beam-cone" fill="url(#kmBeamGrad)" points="0,0 0,0 0,0"/>
    <polygon class="beam-core" fill="url(#kmBeamGrad)" points="0,0 0,0 0,0" opacity=".6"/>
    <ellipse class="beam-spot" fill="url(#kmSpotGrad)" cx="-999" cy="-999" rx="150" ry="110"/>
  </svg>
